{{- range $name := list "cache" "queue" "socketio" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-{{ $name }}
spec:
  selector:
    matchLabels:
      app: redis-{{ $name }}
  template:
    metadata:
      labels:
        app: redis-{{ $name }}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-{{ $name }}
spec:
  selector:
    app: redis-{{ $name }}
  ports:
    - port: 6379
{{- end }}