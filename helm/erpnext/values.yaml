# Default values for erpnext.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  backend:
    repository: govindhan1234/erpbackend
    tag: latest
    pullPolicy: Always
  frontend:
    repository: govindhan1234/erpfrontend
    tag: latest
    pullPolicy: Always

service:
  type: LoadBalancer
  backendPort: 8000
  frontendPort: 80

mariadb:
  enabled: true
  rootPassword: YourStrongPassword123
  host: erpnext-db
  image: mariadb:10.6

redis:
  cache:
    host: redis-cache
  queue:
    host: redis-queue
  socketio:
    host: redis-socketio